<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intact</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' aria-hidden='true'%3E%3Cdefs%3E%3ClinearGradient id='lg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cf6'/%3E%3Cstop offset='1' stop-color='%232dd4bf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23lg)'/%3E%3Cpath d='M16 6.5 24 9.6v6.1c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V9.6Z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='m12.4 16.2 2.6 2.6 4.8-5' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{color-scheme:dark;--bg:#0c1017;--side:#10151e;--card:#141a25;--card2:#1b2331;--line:#232d3d;--fg:#e4e9f1;
        --muted:#95a0b3;--faint:#657086;--accent:#8b80f9;--accent-strong:#6c5ce7;--accent-soft:rgba(139,128,249,.15);
        --accent-fg:#fff;--mint:#5eead4;--ok:#4ade80;--ok-soft:rgba(74,222,128,.12);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.1);
        --err:#fb7185;--err-soft:rgba(251,113,133,.12);--code:#5eead4;--shadow:0 20px 50px rgba(0,0,0,.55)}
  @media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#f3f5f9;--side:#fff;--card:#fff;--card2:#eef1f6;
        --line:#dfe4ec;--fg:#141a25;--muted:#526076;--faint:#8591a5;--accent:#5b4bdb;--accent-strong:#5b4bdb;
        --accent-soft:rgba(91,75,219,.1);--mint:#0f9488;--ok:#15803d;--ok-soft:rgba(21,128,61,.1);--warn:#b45309;
        --warn-soft:rgba(180,83,9,.08);--err:#e11d48;--err-soft:rgba(225,29,72,.08);--code:#0f766e;--shadow:0 20px 50px rgba(20,26,37,.14)}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:var(--bg);color:var(--fg);
       display:grid;grid-template-columns:15rem 1fr}
  aside{background:var(--side);border-right:1px solid var(--line);padding:1.1rem .75rem;display:flex;flex-direction:column;
        gap:.25rem;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:.7rem;padding:.35rem .5rem 1.25rem;margin-bottom:.5rem;border-bottom:1px solid var(--line);text-decoration:none}
  .logo{width:40px;height:40px;flex:none;filter:drop-shadow(0 4px 14px rgba(124,108,246,.45))}
  .logo svg{width:100%;height:100%;display:block}
  .brand b{display:block;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;
          background:linear-gradient(90deg,var(--fg) 20%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.02em}
  aside a{display:flex;align-items:center;gap:.65rem;padding:.5rem .7rem;border-radius:8px;color:var(--muted);
          text-decoration:none;font-size:.88rem}
  aside a:hover{color:var(--fg);background:var(--card2)}
  aside a.brand:hover{background:none}
  aside a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  aside a .ct{margin-left:auto;font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums}
  aside nav{display:grid;gap:.25rem}
  aside .spacer{flex:1}
  aside form button{width:100%;justify-content:flex-start}
  svg.i{width:18px;height:18px;flex:none}
  svg.s{width:14px;height:14px;flex:none}
  .page{min-width:0;display:flex;flex-direction:column}
  .ph{display:flex;align-items:center;gap:.75rem;padding:1.1rem 2rem;border-bottom:1px solid var(--line);min-height:4.5rem}
  .ph h1{font-size:1.25rem;margin:0;font-weight:650}
  .ph p{margin:0;color:var(--muted);font-size:.85rem}
  .crumb{color:var(--muted);text-decoration:none}
  .crumb:hover{color:var(--fg)}
  .content{padding:1.5rem 2rem 3rem;max-width:76rem;width:100%;display:grid;gap:1.5rem;align-content:start}
  h2{font-size:1.02rem;margin:0;font-weight:600}
  .sec{display:grid;gap:.85rem}
  .sech{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .card.pad{padding:1.1rem 1.25rem}
  .cardh{display:flex;align-items:center;gap:.75rem;padding:.9rem 1.25rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .cardh .grow{min-width:min(12rem,100%)}
  .grow{flex:1}
  .muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.8rem}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.8rem}
  code{color:var(--code)}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.75rem}
  .pcard{display:flex;align-items:center;gap:.75rem;padding:.85rem 1rem;background:var(--card);border:1px solid var(--line);
         border-radius:11px;text-decoration:none;color:inherit;min-width:0}
  .pcard:hover{border-color:var(--accent)}
  .pcard.dim{opacity:.55}
  .pcard .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .av{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff;flex:none}
  .av.sm{width:22px;height:22px;border-radius:6px;font-size:.62rem}
  .status{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;color:var(--faint)}
  .status.on{color:var(--ok)}
  .status.on::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.7rem;font-weight:500;border-radius:6px;
         padding:.05rem .45rem;background:var(--card2);color:var(--muted);white-space:nowrap}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.accent{background:var(--accent-soft);color:var(--accent)}
  .notice{padding:.7rem 1rem;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:.85rem}
  .row{display:flex;align-items:center;gap:.85rem;padding:.8rem 1.25rem;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .who{flex:1;min-width:0}
  .row .who .l{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-top:.15rem}
  .row.off .who{opacity:.5}
  .idx{color:var(--faint);font-size:.75rem;min-width:1.5rem;text-align:right;font-variant-numeric:tabular-nums;flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:.4rem}
  .chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--card2);border:1px solid var(--line);border-radius:8px;
        padding:.25rem .55rem;font-size:.8rem;max-width:100%;color:var(--fg)}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button.chip{cursor:pointer;min-height:0}
  button.chip:hover{border-color:var(--accent)}
  button.chip.on{border-color:var(--accent);background:var(--accent-soft)}
  .copyline{display:flex;align-items:center;gap:.5rem;background:var(--bg);border:1px solid var(--line);border-radius:9px;
            padding:.3rem .3rem .3rem .75rem;min-width:0}
  .copyline code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg);font-size:.85rem}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:.6rem 1.25rem;align-items:baseline}
  .kv .k{color:var(--muted);font-size:.8rem}
  pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem;overflow:auto;
      font:.8rem/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:.6rem 1.25rem;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  th{color:var(--muted);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .scroll{overflow-x:auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.75rem}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1.1rem}
  .stat .k{color:var(--muted);font-size:.78rem}
  .stat .v{font-size:1.45rem;font-weight:650;font-variant-numeric:tabular-nums}
  .empty{display:grid;place-items:center;gap:.5rem;text-align:center;padding:2.5rem 1rem;color:var(--muted)}
  .empty .ic{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
  .empty b{color:var(--fg)}
  button{font:inherit;min-height:36px;padding:.4rem .85rem;border:0;border-radius:8px;cursor:pointer;display:inline-flex;
         align-items:center;gap:.4rem;justify-content:center}
  button.primary{background:var(--accent-strong);color:var(--accent-fg);font-weight:600}
  button.primary:hover{filter:brightness(1.07)}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  button.ghost:hover{color:var(--fg);border-color:var(--faint)}
  button.plain{background:transparent;color:var(--muted)}
  button.plain:hover{color:var(--fg);background:var(--card2)}
  button.danger{background:transparent;color:var(--err)}
  button.danger:hover{background:var(--err-soft)}
  button.icon{min-height:30px;min-width:30px;padding:.2rem;background:transparent;color:var(--muted)}
  button.icon:hover{color:var(--fg);background:var(--card2)}
  button:disabled{opacity:.35;cursor:default;pointer-events:none}
  input,select{font:inherit;padding:.5rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);
               min-height:38px;width:100%}
  input:focus,select:focus,button:focus-visible,a:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  label.f,div.f{display:grid;gap:.35rem;font-size:.82rem;font-weight:500}
  .hint{font-size:.75rem;color:var(--faint);font-weight:400}
  .search{position:relative;max-width:18rem;width:100%}
  .search svg{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);color:var(--faint)}
  .search input{padding-left:2rem}
  .switch{position:relative;width:38px;height:22px;flex:none;display:inline-block}
  .switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;min-height:0}
  .switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s;pointer-events:none}
  .switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
  .switch input:checked+span{background:var(--accent-strong)}
  .switch input:checked+span::after{transform:translateX(16px)}
  .switch input:focus-visible+span{box-shadow:0 0 0 3px var(--accent-soft)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:1rem;z-index:20}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(36rem,100%);
         max-height:90vh;display:flex;flex-direction:column}
  .modal.sm{width:min(26rem,100%)}
  .mh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
  .mh strong{font-size:1rem}
  .mb{padding:1.1rem 1.25rem;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:1rem}
  .mf{display:flex;justify-content:flex-end;gap:.5rem;padding:.85rem 1.25rem;border-top:1px solid var(--line)}
  .err-msg{color:var(--err);font-size:.82rem;min-height:1.2em}
  .toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);
         box-shadow:var(--shadow);padding:.55rem 1rem;border-radius:10px;font-size:.85rem;z-index:30;max-width:90vw}
  .tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:-.5rem}
  .tabs a{padding:.6rem .95rem;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;
          white-space:nowrap;font-weight:500;display:inline-flex;gap:.4rem;align-items:center}
  .tabs a:hover{color:var(--fg)}
  .tabs a.on{color:var(--fg);border-bottom-color:var(--accent)}
  .tabs .ct{font-size:.72rem;color:var(--faint)}
  .badge.err{background:var(--err-soft);color:var(--err)}
  .drow{display:grid;grid-template-columns:8.5rem 5.5rem minmax(0,1fr) auto;gap:.3rem 1rem;align-items:center;padding:.75rem 1.25rem;border-bottom:1px solid var(--line)}
  .drow:last-child{border-bottom:0}
  .drow .p{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.82rem;overflow-wrap:anywhere}
  .drow .acts{display:flex;gap:.35rem;align-items:center}
  .drow details{grid-column:3/5}
  .drow details pre{margin-top:.4rem;max-height:10rem}
  @media (max-width:820px){.drow{grid-template-columns:1fr auto}.drow details{grid-column:1/-1}}
  .doc{max-width:52rem;display:grid;gap:1rem;line-height:1.65}
  .doc h2{font-size:1.15rem;margin:.5rem 0 0}
  .doc p,.doc ul,.doc ol{margin:0;color:var(--muted)}
  .doc li{margin:.2rem 0}
  .doc table{border:1px solid var(--line);border-radius:10px;border-collapse:separate;border-spacing:0;overflow:hidden}
  .doc th,.doc td{padding:.55rem .85rem;vertical-align:top}
  .doc td{color:var(--muted)}
  [hidden]{display:none!important}
  @media (max-width:820px){
    body{grid-template-columns:1fr}
    aside{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:.55rem .75rem .4rem;gap:.3rem;
          border-right:0;border-bottom:1px solid var(--line);z-index:10}
    aside nav{order:3;flex:1 0 100%;display:flex;gap:.15rem;overflow-x:auto;margin:0 -.25rem}
    .brand{padding:0 .5rem 0 0;margin:0;border:0}.brand small{display:none}.brand b{font-size:1.15rem}.logo{width:30px;height:30px}
    aside a{padding:.45rem .6rem;white-space:nowrap}
    aside a .ct,aside a svg{display:none}
    aside .spacer{flex:1}
    aside form button{width:auto}
    aside form button span{display:none}
    .ph{padding:1rem;flex-wrap:wrap}
    .content{padding:1rem 1rem 2.5rem}
    .row{padding:.7rem 1rem;flex-wrap:wrap}
    .kv{grid-template-columns:1fr}
    .kv .k{margin-bottom:-.35rem}
  }
</style>
</head>

<!-- add account -->
<div id="aModal" class="overlay" hidden>

<script>
// Every string shown comes from stored data or a provider response, so it is
// written with textContent, never innerHTML, to keep it from injecting HTML.
const $=id=>document.getElementById(id);
function el(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v===false||v==null)continue;
    if(k==='class')e.className=v; else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat())if(c!=null&&c!==false)e.append(c);
  return e;
}
function svg(paths,cls){
  const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');
  s.setAttribute('viewBox','0 0 24 24');s.setAttribute('class',cls||'s');s.setAttribute('fill','none');
  s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2');s.setAttribute('aria-hidden','true');
  for(const d of paths){const p=document.createElementNS(ns,'path');p.setAttribute('d',d);s.append(p)}
  return s;
}

async function load(){

  S.drift=d.status==='fulfilled'?d.value.changes||[]:[];

  $('ctDrift').textContent=unacked||'';$('ctDrift').style.color=unacked?'var(--warn)':'';
  S.accounts=a.status==='fulfilled'?a.value.accounts||[]:[];

  S.keys=k.status==='fulfilled'?k.value.keys||[]:[];

  S.usage=u.status==='fulfilled'?u.value.usage||[]:[];

// A provider's model list, fetched through its first active account.
async function modelsFor(p){
  if(modelCache[p])return modelCache[p];
  const acc=activeOf(p)[0];
  if(!acc)return modelCache[p]={error:'No active account'};
  try{
    const r=await fetch('/accounts/'+acc.id+'/models');const d=await r.json();
    if(!r.ok||d.error)return modelCache[p]={error:'Provider error: '+((d.error&&d.error.message)||d.error||r.status)};
    let ids=[];
    if(Array.isArray(d.data))ids=d.data.map(m=>m.id||m.name).filter(Boolean);
    else if(Array.isArray(d.models))ids=d.models.map(m=>typeof m==='string'?m:(m.id||m.name)).filter(Boolean);
    return modelCache[p]={ids:[...new Set(ids)].sort()};
  }catch(e){return modelCache[p]={error:'Could not reach the models endpoint'}}
}

// ---- Blacklist
// What intact removes from a request before it reaches a provider, by kind.
const KINDS={
  field:{name:'Body field',tab:'Fields',ex:'messages.*.cache_control'},
  schema:{name:'Schema key',tab:'Schema keys',ex:'$id'},
  system:{name:'System line',tab:'System lines',ex:'^x-anthropic-billing-header:.*$'},
  header:{name:'Header',tab:'Headers',ex:'anthropic-beta'},
};
function viewBlacklist(v,tab){
  if(!KINDS[tab])tab='field';
  header('Blacklist',null,el('button',{class:'primary',type:'button',onclick:()=>editFilter(null,tab)},svg(ICON.plus),'Block '+KINDS[tab].name.toLowerCase()));
  v.append(el('div',{class:'tabs',role:'tablist'},Object.entries(KINDS).map(([k,d])=>{
    const n=S.filters.filter(f=>f.kind===k).length;
    return el('a',{role:'tab',href:'#/blacklist/'+k,'aria-selected':String(k===tab),class:k===tab?'on':''},d.tab,n?el('span',{class:'ct',text:String(n)}):null);
  })));
  const list=S.filters.filter(f=>f.kind===tab)
    .sort((a,b)=>(a.provider==='*'?-1:b.provider==='*'?1:pname(a.provider).localeCompare(pname(b.provider)))||a.pattern.localeCompare(b.pattern));
  if(!list.length){v.append(el('div',{class:'card empty'},el('b',{},'Nothing blocked'),
    el('button',{class:'primary',type:'button',onclick:()=>editFilter(null,tab)},svg(ICON.plus),'Block '+KINDS[tab].name.toLowerCase())));return}
  v.append(el('div',{class:'card'},list.map(f=>{
    const sw=el('input',{type:'checkbox',checked:f.enabled,'aria-label':'Enabled'});
    sw.onchange=async()=>{try{await postJSON('/filters',{...f,enabled:sw.checked});f.enabled=sw.checked;await load()}catch(e){sw.checked=!sw.checked;alert(e.message)}};
    return el('div',{class:'row'+(f.enabled?'':' off')},
      el('div',{class:'who'},el('div',{class:'l mono',text:f.pattern}),f.note?el('div',{class:'faint small',text:f.note}):null),
      f.provider==='*'?el('span',{class:'badge'},'All providers')
        :el('span',{class:'badge',style:'gap:.35rem'},avatar(f.provider,true),pname(f.provider)),
      el('button',{class:'icon',type:'button',title:'Edit','aria-label':'Edit '+f.pattern,onclick:()=>editFilter(f)},svg(ICON.edit)),
      el('button',{class:'icon',type:'button',title:'Delete','aria-label':'Delete '+f.pattern,onclick:async()=>{if(!confirm('Unblock "'+f.pattern+'"?'))return;
        try{await api('/filters/'+f.id+'/delete',{method:'POST'});toast('Removed');await load()}catch(e){alert(e.message)}}},svg(ICON.trash)),
      el('label',{class:'switch'},sw,el('span')));
  })));
}
let F=null;
function editFilter(f,kind){
  F=f?{...f}:{provider:'*',kind:kind||'field',pattern:'',note:'',enabled:true};
  $('fTitle').textContent=(f?'Edit blocked ':'Block ')+(KINDS[F.kind]||KINDS.field).name.toLowerCase();
  const ids=[...new Set([...S.providers.map(x=>x.id),...S.accounts.map(a=>a.provider)])].sort((a,b)=>pname(a).localeCompare(pname(b)));
  if(!ids.includes(F.provider)&&F.provider!=='*')ids.push(F.provider);
  $('fProv').replaceChildren(el('option',{value:'*',text:'All providers'}),...ids.map(p=>el('option',{value:p,text:pname(p)+(pname(p)!==p?' ('+p+')':'')})));
  $('fProv').value=F.provider;
  $('fKind').replaceChildren(...Object.entries(KINDS).map(([k,d])=>el('option',{value:k,text:d.name})));
  $('fKind').value=F.kind;
  const hint=()=>{$('fPat').placeholder=KINDS[$('fKind').value].ex};
  $('fKind').onchange=hint;hint();
  $('fPat').value=F.pattern;$('fNote').value=F.note;$('fErr').textContent='';
  openModal('fModal');
}
$('fForm').onsubmit=async e=>{
  e.preventDefault();
  if(guard($('fForm')))return;
  try{
    await postJSON('/filters',{...F,provider:$('fProv').value,kind:$('fKind').value,pattern:$('fPat').value.trim(),note:$('fNote').value.trim()});
    closeModal('fModal');toast('Blocked');
    const k=$('fKind').value;if(!location.hash.endsWith('/'+k))location.hash='#/blacklist/'+k;await load();
  }catch(err){$('fErr').textContent=err.message}
  finally{release($('fForm'))}
};

// ---- Drift
// Structure changes seen in live traffic: a client adding a field (a
// candidate for the blacklist) or a provider changing its answer.
const DRIFT_KIND={added:['badge warn','added'],removed:['badge err','removed'],type:['badge warn','type changed'],returned:['badge ok','returned']};
// A learned path ("messages[].x") as a blacklist field pattern ("messages.*.x").
const toFieldPattern=p=>p.replace(/\[\]/g,'.*').replace(/\{\*\}/g,'*');
function viewDrift(v,tab){
  if(!['new','all','fields'].includes(tab))tab='new';
  const unacked=S.drift.filter(c=>!c.acked);
  header('Drift',null,tab==='new'&&unacked.length?el('button',{class:'ghost',type:'button',onclick:()=>ackDrift([])},'Acknowledge all'):null);
  v.append(el('div',{class:'tabs',role:'tablist'},[['new','New',unacked.length],['all','All',0],['fields','Fields',0]].map(([k,n,c])=>
    el('a',{role:'tab',href:'#/drift/'+k,'aria-selected':String(k===tab),class:k===tab?'on':''},n,c?el('span',{class:'ct',text:String(c)}):null))));
  if(tab==='fields'){v.append(driftFields());return}
  const list=tab==='new'?unacked:S.drift;
  if(!list.length){v.append(el('div',{class:'card empty'},el('b',{},tab==='new'?'No new changes':'No changes recorded')));return}
  v.append(el('div',{class:'card'},list.map(c=>{
    const [cls,label]=DRIFT_KIND[c.kind]||['badge',c.kind];
    const blocked=S.filters.some(f=>f.kind==='field'&&f.pattern===toFieldPattern(c.path)&&(f.provider===c.provider||f.provider==='*'));
    const canBlock=c.direction==='request'&&(c.kind==='added'||c.kind==='type')&&!blocked;
    return el('div',{class:'drow'+(c.acked?' off':'')},
      el('div',{},el('div',{class:'small',text:c.at.replace('T',' ').slice(0,16)}),el('div',{class:'faint small',text:c.direction})),
      el('span',{class:cls,style:'justify-content:center',text:label}),
      el('div',{style:'min-width:0'},
        el('div',{class:'p',text:c.path}),
        el('div',{class:'faint small',style:'display:flex;gap:.4rem;align-items:center;flex-wrap:wrap'},avatar(c.provider,true),pname(c.provider),
          el('code',{class:'faint',text:c.endpoint+(c.event?' · '+c.event:'')}),
          c.oldType||c.newType?el('span',{text:(c.oldType||'—')+' → '+(c.newType||'—')}):null)),
      el('div',{class:'acts'},
        blocked?el('span',{class:'badge',text:'blocked'}):null,
        canBlock?el('button',{class:'primary',type:'button',title:'Add '+toFieldPattern(c.path)+' to the blacklist of '+pname(c.provider),
          onclick:()=>blockDrift(c)},'Block'):null,
        c.acked?null:el('button',{class:'ghost',type:'button',onclick:()=>ackDrift([c.id])},'Ack')),
      c.sample?el('details',{},el('summary',{class:'faint small'},'Sample'),el('pre',{text:c.sample})):null);
  })));
}
async function ackDrift(ids){
  try{await postJSON('/drift/ack',{ids});await load()}catch(e){alert(e.message)}
}
async function blockDrift(c){
  try{
    await postJSON('/filters',{provider:c.provider,kind:'field',pattern:toFieldPattern(c.path),note:'from drift: '+c.kind+' on '+c.endpoint,enabled:true});
    await postJSON('/drift/ack',{ids:[c.id]});
    toast('Blocked '+toFieldPattern(c.path));await load();
  }catch(e){alert(e.message)}
}
function driftFields(){
  const provs=[...new Set(S.drift.map(c=>c.provider).concat(S.accounts.filter(a=>a.isActive).map(a=>a.provider)))].filter(wired).sort();
  const psel=el('select',{style:'width:auto','aria-label':'Provider'},provs.map(p=>el('option',{value:p,text:pname(p)})));
  const dsel=el('select',{style:'width:auto','aria-label':'Direction'},el('option',{value:'request',text:'Requests from clients'}),el('option',{value:'response',text:'Answers from the provider'}));
  const box=el('div',{class:'card'},el('div',{class:'empty',text:'Loading…'}));
  const render=async()=>{
    try{
      const r=await api('/drift/fields?provider='+encodeURIComponent(psel.value)+'&direction='+dsel.value);
      const byKey={};
      for(const f of r.fields){const k=f.key.split('|').slice(2).join(' · ').replace(/ · $/,'');(byKey[k]=byKey[k]||[]).push(f)}
      const keys=Object.keys(byKey).sort();
      if(!keys.length){box.replaceChildren(el('div',{class:'empty'},el('b',{},'Nothing learned yet')));return}
      box.replaceChildren(el('div',{class:'scroll'},el('table',{},
        el('thead',{},el('tr',{},el('th',{},'Endpoint · event'),el('th',{},'Field'),el('th',{},'Type'),el('th',{class:'num'},'Seen'))),
        el('tbody',{},keys.flatMap(k=>byKey[k].map((f,i)=>el('tr',{class:f.gone?'off':''},
          el('td',{class:'faint small',text:i===0?k:''}),el('td',{class:'mono',text:f.path}),el('td',{class:'faint',text:f.type+(f.gone?' (gone)':'')}),
          el('td',{class:'num',text:fmt(f.seen)}))))))));
    }catch(e){box.replaceChildren(el('div',{class:'empty',text:e.message}))}
  };
  psel.onchange=render;dsel.onchange=render;render();
  return el('div',{class:'sec'},el('div',{class:'sech'},psel,dsel),box);
}

function viewDocs(v,id){

  header('Docs');
  v.append(el('div',{class:'tabs',role:'tablist'},DOCS.map(x=>el('a',{role:'tab',href:'#/docs/'+x.id,'aria-selected':String(x===d),class:x===d?'on':''},x.title))),
    el('article',{class:'doc'},d.body()));

// ---- Usage
function viewUsage(v){
  const days=[...new Set(S.usage.map(u=>u.day))];
  const sel=el('select',{style:'width:auto','aria-label':'Day'},el('option',{value:'',text:'All days'}),days.map(d=>el('option',{value:d,text:d})));
  header('Usage',null,S.usage.length?sel:null);
  const today=new Date().toISOString().slice(0,10);
  if(days.includes(today))sel.value=today;
  const stats=el('div',{class:'stats'}),tb=el('tbody');
  v.append(stats,el('div',{class:'card scroll'},el('table',{},
    el('thead',{},el('tr',{},el('th',{},'Day'),el('th',{},'Account'),el('th',{},'Model'),el('th',{class:'num'},'Input'),el('th',{class:'num'},'Output'),el('th',{class:'num'},'Requests'))),tb)));
  const render=()=>{
    const rows=S.usage.filter(u=>!sel.value||u.day===sel.value);
    const sum=k=>rows.reduce((s,u)=>s+u[k],0);
    stats.replaceChildren(...[['Requests',sum('requests')],['Input tokens',sum('inputTokens')],['Output tokens',sum('outputTokens')]]
      .map(([k,n])=>el('div',{class:'stat'},el('div',{class:'k',text:k}),el('div',{class:'v',text:fmt(n)}))));
    if(!rows.length){tb.replaceChildren(el('tr',{},el('td',{colspan:6},el('div',{class:'empty'},el('b',{},'No usage recorded yet'),'Requests through /v1 show up here.'))));return}
    tb.replaceChildren(...rows.map(u=>{const a=accById(u.connectionId);
      return el('tr',{},el('td',{class:'faint',text:u.day}),
        el('td',{},a?el('span',{style:'display:inline-flex;align-items:center;gap:.45rem'},avatar(a.provider,true),a.label||short(a.id))
                    :el('span',{class:'mono faint',text:short(u.connectionId)+' (deleted)'})),
        el('td',{class:'mono',text:u.model||'—'}),
        el('td',{class:'num',text:fmt(u.inputTokens)}),el('td',{class:'num',text:fmt(u.outputTokens)}),el('td',{class:'num',text:fmt(u.requests)}))}));
  };
  sel.onchange=render;render();
}
