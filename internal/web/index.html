<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intact</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px system-ui, -apple-system, Segoe UI, sans-serif;
         margin: 0; padding: 2rem 1.25rem; background: #0f1115; color: #e6e9ef; }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.5rem; color: #8b94a5; font-size: .82rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid #262b36; }
  th { color: #8b94a5; font-weight: 500; font-size: .75rem;
       text-transform: uppercase; letter-spacing: .04em; }
  code { font-family: ui-monospace, Consolas, monospace; color: #7dd3fc; font-size: .82rem; }
  .yes { color: #4ade80; }
  .no  { color: #8b94a5; }
</style>
</head>
<body>
<main>
  <h1>Accounts</h1>
  <p class="sub">Credentials stay on this host. Responses from a provider are passed through unchanged.</p>
  <table>
    <thead><tr><th>Provider</th><th>Label</th><th>Connection id</th><th>Active</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody>
  </table>

  <h1 style="margin-top:2rem">Usage</h1>
  <p class="sub">Daily token totals per account and model, read from the responses that passed through.</p>
  <table>
    <thead><tr><th>Day</th><th>Connection id</th><th>Model</th><th>Input</th><th>Output</th><th>Requests</th></tr></thead>
    <tbody id="usage"><tr><td colspan="6">Loading…</td></tr></tbody>
  </table>
</main>
<script>
// Values come from provider responses, so every cell is set with textContent.
// A model string like `<img src=x onerror=...>` must render as text, never as
// markup, or a hostile upstream runs script in this origin.
function message(tbody, span, text) {
  tbody.replaceChildren();
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = span;
  td.textContent = text;
  tr.append(td);
  tbody.append(tr);
}

// cols: each entry is a value, or {code:value} to wrap it in <code>, or
// {cls, text} to set a class. Every value is written as text.
function renderRows(tbody, items, span, empty, toCols) {
  if (!items.length) { message(tbody, span, empty); return; }
  tbody.replaceChildren();
  for (const item of items) {
    const tr = document.createElement('tr');
    for (const col of toCols(item)) {
      const td = document.createElement('td');
      if (col && col.code !== undefined) {
        const code = document.createElement('code');
        code.textContent = col.code;
        td.append(code);
      } else if (col && col.cls !== undefined) {
        td.className = col.cls;
        td.textContent = col.text;
      } else {
        td.textContent = col;
      }
      tr.append(td);
    }
    tbody.append(tr);
  }
}

function load(url, tbody, span, empty, toCols) {
  fetch(url)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => renderRows(tbody, d[Object.keys(d)[0]] || [], span, empty, toCols))
    .catch(() => message(tbody, span, 'Could not reach ' + url + '.'));
}

load('/accounts', document.getElementById('rows'), 4, 'No accounts yet.',
  a => [a.provider, a.label, {code: a.id},
    {cls: a.isActive ? 'yes' : 'no', text: a.isActive ? 'yes' : 'no'}]);

load('/usage', document.getElementById('usage'), 6, 'No usage recorded yet.',
  u => [u.day, {code: u.connectionId}, u.model, u.inputTokens, u.outputTokens, u.requests]);
</script>
</body>
</html>
