<!-- add account -->
<div id="aModal" class="overlay" hidden>
  <div class="modal sm" role="dialog" aria-modal="true" aria-labelledby="aTitle">
    <div class="mh"><strong id="aTitle">Add connection</strong><button class="icon" type="button" data-close aria-label="Close">✕</button></div>
    <form id="aForm">
      <div class="mb">
        <input type="hidden" name="provider" id="aProv">
        <label class="f" id="aIdRow">Provider id
          <input id="aId" placeholder="e.g. tokenharbor" autocomplete="off" spellcheck="false"></label>
        <label class="f" id="aBaseRow">Base URL<input name="base_url" id="aBase" placeholder="https://example.com/v1" autocomplete="off" spellcheck="false"></label>
        <label class="f" id="aApiRow">API standard<select name="api" id="aApi">
          <option value="openai">OpenAI Chat Completions</option>
          <option value="anthropic">Anthropic Messages</option>
          <option value="responses">OpenAI Responses</option></select></label>
        <label class="f">Name<input name="label" placeholder="e.g. Work key" autocomplete="off"></label>
        <label class="f" id="aAcctRow">Account ID<input name="account_id" id="aAcct" autocomplete="off" spellcheck="false"></label>
        <label class="f" id="aKeyRow">API key<input name="secret" id="aKey" type="password" autocomplete="off"></label>
        <p class="hint" id="aNoKey" style="margin:0">This provider needs no key.</p>
        <div class="err-msg" id="aErr"></div>
      </div>
      <div class="mf"><button class="ghost" type="button" data-close>Cancel</button><button class="primary" type="submit">Save</button></div>

// The page is written in English; in Vietnamese each fixed string is looked up
// in VI as a whole. Text built with data uses a template: t('Delete "{0}"?', x).
// el() translates the strings it is given, and the static HTML is translated
// once at start, so a string not in VI (a model name, an account) stays as is.
const LANGS={en:'EN',vi:'VI'};
let LANG=(()=>{try{const v=localStorage.getItem('intact-lang');if(LANGS[v])return v}catch(e){}
  return (navigator.language||'').toLowerCase().startsWith('vi')?'vi':'en'})();
document.documentElement.lang=LANG;
function tr(s){if(LANG==='en'||typeof s!=='string')return s;const v=VI[s];return v===undefined?s:v}
function t(s,...args){let out=tr(s);args.forEach((a,i)=>{out=out.split('{'+i+'}').join(String(a))});return out}
function setLang(l){try{localStorage.setItem('intact-lang',l)}catch(e){}location.reload()}
const _alert=window.alert.bind(window),_confirm=window.confirm.bind(window);
window.alert=m=>_alert(tr(m));window.confirm=m=>_confirm(tr(m));
// tResult reads the server's auto-test summary ("17 of 22 tested work").
function tResult(r){const m=/^(\d+) of (\d+) tested work$/.exec(r||'');return m?t('{0} of {1} tested work',m[1],m[2]):(r||'')}
function translateStatic(root){
  if(LANG==='en')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode();n;n=w.nextNode()){
    const s=n.nodeValue.trim();if(!s)continue;
    const v=VI[s];if(v!==undefined)n.nodeValue=n.nodeValue.replace(s,v);
  }
  for(const e of root.querySelectorAll('[placeholder],[title],[aria-label]'))
    for(const a of ['placeholder','title','aria-label']){const v=e.getAttribute(a);if(v&&VI[v]!==undefined)e.setAttribute(a,VI[v])}
}
// Theme: auto follows the system; light or dark is the user's choice, kept in
// this browser. The attribute is set in <head> too, before the page paints.
const THEMES=['auto','light','dark'];
let THEME=(()=>{try{const v=localStorage.getItem('intact-theme');if(THEMES.includes(v))return v}catch(e){}return 'auto'})();
function applyTheme(){if(THEME==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=THEME}
function setTheme(v){THEME=v;try{localStorage.setItem('intact-theme',v)}catch(e){}applyTheme();paintPrefs()}
function paintPrefs(){
  const box=document.getElementById('prefs');if(!box)return;
  const seg=(items,cur,on)=>el('span',{class:'seg sm'},...items.map(([k,label,title])=>
    el('button',{type:'button','aria-pressed':String(k===cur),title:title||label,onclick:()=>on(k)},label)));
  box.replaceChildren(
    seg(Object.entries(LANGS).map(([k,n])=>[k,n,k==='en'?'English':'Tiếng Việt']),LANG,l=>{if(l!==LANG)setLang(l)}),
    seg([['auto','Auto','Follow the system'],['light','☀','Light'],['dark','☾','Dark']],THEME,setTheme));

const $=id=>document.getElementById(id);
function el(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v===false||v==null)continue;
    if(k==='class')e.className=v; else if(k==='text')e.textContent=tr(v);
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':(k==='title'||k==='placeholder'||k==='aria-label')?tr(v):v);
  }
  for(const c of kids.flat())if(c!=null&&c!==false)e.append(typeof c==='string'?tr(c):c);
  return e;
}

  s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2');s.setAttribute('aria-hidden','true');
  for(const d of paths){const p=document.createElementNS(ns,'path');p.setAttribute('d',d);s.append(p)}
  return s;
}

async function load(){
  const [a,u,p,f,k,d]=await Promise.allSettled([api('/accounts'),api('/usage'),api('/providers'),api('/filters'),api('/keys'),api('/drift/changes?limit=500')]);
  S.drift=d.status==='fulfilled'?d.value.changes||[]:[];
  const unacked=d.status==='fulfilled'?d.value.unacked:0;
  $('ctDrift').textContent=unacked||'';$('ctDrift').style.color=unacked?'var(--warn)':'';
  S.accounts=a.status==='fulfilled'?a.value.accounts||[]:[];
  S.filters=f.status==='fulfilled'?f.value.filters||[]:[];
  S.keys=k.status==='fulfilled'?k.value.keys||[]:[];
  $('ctFilter').textContent=S.filters.filter(x=>x.enabled).length||'';
  S.usage=u.status==='fulfilled'?u.value.usage||[]:[];
  S.providers=p.status==='fulfilled'?p.value.providers||[]:[];
  $('ctProv').textContent=new Set(S.accounts.map(x=>x.provider)).size||'';
  route();
}
// A provider's model list, fetched through its first active account.
async function modelsFor(p){
  if(modelCache[p])return modelCache[p];
  try{
    const r=await api('/providers/'+encodeURIComponent(p)+'/models');
    if(!r.models.length)return modelCache[p]={error:r.ok?'The provider lists no models.':'Could not read the model list from the provider.'};
    return modelCache[p]={ids:r.models};
  }catch(e){return modelCache[p]={error:e.message}}
}

function route(){
  const parts=(location.hash.replace(/^#\/?/,'')||'providers').split('/');

    if(a.dataset.nav===page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  }
  const v=$('view');v.replaceChildren();
  if(page==='endpoint')return viewEndpoint(v,parts[1]);
  if(page==='usage')return viewUsage(v);
  if(page==='blacklist')return viewBlacklist(v,parts[1]);
  if(page==='docs')return viewDocs(v,parts[1]);
  if(page==='drift')return viewDrift(v,parts[1]);

  if(page==='providers'&&parts[1])return viewProvider(v,decodeURIComponent(parts[1]));

// ---- Data tables
// dataTable draws rows under a header that sorts and a row of filters.
// Clicking a column name sorts it ascending, then descending, then not at all.
// Under each column, a filter:
//   text  typed words, as in nameFilter: "a b", "a|b", "-x", "/re/"
//   num   a comparison: ">100", "<=5", "10-20", "=3"
//   chip  a pick list of the values present, each with its count
// A column is {id, label, type, get, chips, td, th, cls, style, sort}:
//   get(r)    the text or number sorted and filtered;
//   chips(r)  the chip values of a row (default [get(r)]); none shows as "—";
//   td(r)     the cell content;
//   th        a node that replaces the label (such as a select-all box).
// The filter row is built once, so typing keeps its focus; the body is
// redrawn by render(). visible() is the filtered, sorted rows.
// One pick list is open at a time, page-wide; a click outside it, Escape or a
// scroll outside it closes it.
let dtPop=null,dtUid=0;
function dtClosePop(){if(dtPop){dtPop.remove();dtPop=null}}
document.addEventListener('click',e=>{if(dtPop&&!dtPop.contains(e.target)&&!e.target.closest('.fpick'))dtClosePop()},true);
addEventListener('keydown',e=>{if(e.key==='Escape')dtClosePop()});
addEventListener('scroll',e=>{if(dtPop&&!dtPop.contains(e.target))dtClosePop()},true);
function dataTable({cols,rows,rowAttrs,empty,onRender,initial}){
  const st={sort:null,dir:1,f:{}};
  if(initial)Object.assign(st.f,initial);
  const body=el('tbody');
  const chipVals=(c,r)=>{const v=c.chips?c.chips(r):[c.get(r)];const out=(v||[]).filter(x=>x!==''&&x!=null).map(String);return out.length?out:['—']};
  const numTest=q=>{
    const s=q.replace(/[\s,]/g,'');let m;
    if((m=/^(>=|<=|>|<|=)?(-?\d+(?:\.\d+)?)$/.exec(s))){const n=+m[2];return({'>':v=>v>n,'<':v=>v<n,'>=':v=>v>=n,'<=':v=>v<=n})[m[1]]||(v=>v===n)}
    if((m=/^(-?\d+(?:\.\d+)?)-(-?\d+(?:\.\d+)?)$/.exec(s))){const a=+m[1],b=+m[2];return v=>v>=a&&v<=b}
    return null;
  };
  const passes=r=>cols.every(c=>{
    const f=st.f[c.id];if(f==null||f===''||(f instanceof Set&&!f.size))return true;
    if(c.type==='chip')return chipVals(c,r).some(v=>f.has(v));
    if(c.type==='num'){const test=numTest(f);return test?test(Number(c.get(r))):String(c.get(r)).includes(f)}
    return nameFilter(f)(String(c.get(r)??''));
  });
  const visible=()=>{
    const list=rows().filter(passes);
    const c=cols.find(c=>c.id===st.sort);
    if(c){const g=c.sort||(c.type==='chip'?(r=>chipVals(c,r).join(' ')):c.get);
      list.sort((a,b)=>{const x=g(a),y=g(b);
        const d=(typeof x==='number'&&typeof y==='number')?x-y:String(x??'').localeCompare(String(y??''),undefined,{numeric:true,sensitivity:'base'});
        return d*st.dir})}
    return list;
  };
  const active=()=>cols.some(c=>{const f=st.f[c.id];return f instanceof Set?f.size>0:!!f});
  // Header: names that sort, then filters.
  const arrows={};
  const head=el('tr',{},...cols.map(c=>{
    if(c.th)return el('th',{class:c.cls||'',style:c.style||''},c.th);
    if(c.sort===false||!c.type)return el('th',{class:c.cls||'',style:c.style||''},c.label||'');
    const arrow=el('span',{class:'sort-ar','aria-hidden':'true'});arrows[c.id]=arrow;
    return el('th',{class:(c.cls||'')+' sortable',style:c.style||'','aria-sort':'none'},
      el('button',{class:'th-sort',type:'button',title:'Sort',onclick:()=>{
        if(st.sort!==c.id){st.sort=c.id;st.dir=1}else if(st.dir===1)st.dir=-1;else st.sort=null;
        render()}},c.label,arrow));
  }));
  const inputs={},pickers={};
  const filt=el('tr',{class:'filters'},...cols.map(c=>{
    if(!c.type||c.filter===false)return el('th',{});
    if(c.type==='chip'){
      const b=el('button',{class:'fpick',type:'button','aria-haspopup':'true','data-uid':String(++dtUid),onclick:()=>openPick(c,b)});pickers[c.id]=b;
      return el('th',{},b);
    }
    const i=el('input',{class:'ftext',placeholder:c.type==='num'?'>0, 10-20':'Filter…',autocomplete:'off',spellcheck:'false',
      'aria-label':t('Filter {0}',tr(c.label||c.id))});
    i.value=st.f[c.id]||'';
    let timer=null;i.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{st.f[c.id]=i.value.trim();render()},120)};
    inputs[c.id]=i;return el('th',{},i);
  }));
  // The pick list of a chip column: the values of every row, counted, ticked
  // when shown. It floats over the page so a scrolling table cannot clip it.
  const openPick=(c,btn)=>{
    if(dtPop){const same=dtPop.dataset.for===btn.dataset.uid;dtClosePop();if(same)return}
    const count=new Map();for(const r of rows())for(const v of chipVals(c,r))count.set(v,(count.get(v)||0)+1);
    const vals=[...count.keys()].sort((a,b)=>c.order?c.order(a)-c.order(b):a.localeCompare(b,undefined,{numeric:true}));
    const sel=st.f[c.id] instanceof Set?st.f[c.id]:new Set();
    const pop=el('div',{class:'pop','data-for':btn.dataset.uid,role:'dialog'},
      vals.length?vals.map(v=>{const cb=el('input',{type:'checkbox',checked:sel.has(v)});
        cb.onchange=()=>{cb.checked?sel.add(v):sel.delete(v);st.f[c.id]=sel;render()};
        return el('label',{class:'pop-row'},cb,el('span',{class:'grow'},c.chipLabel?c.chipLabel(v):v),el('span',{class:'faint small',text:String(count.get(v))}))}):
        el('div',{class:'faint small',text:'No values'}),
      el('div',{class:'pop-foot'},el('button',{class:'ghost',type:'button',onclick:()=>{sel.clear();st.f[c.id]=sel;dtClosePop();render()}},'Show all')));
    document.body.append(pop);dtPop=pop;
    const r=btn.getBoundingClientRect();
    pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+'px';
    pop.style.top=Math.min(r.bottom+4,innerHeight-pop.offsetHeight-8)+'px';
  };
  const clearBtn=el('button',{class:'chip',type:'button',hidden:true,onclick:()=>{for(const k in st.f)delete st.f[k];for(const i of Object.values(inputs))i.value='';render()}},'Clear filters');
  const table=el('table',{class:'dt'},el('thead',{},head,filt),body);
  const render=()=>{

      const v=c.td?c.td(r):c.get(r);return el('td',{class:c.cls||'',style:c.tdStyle||''},v==null||v===''?'—':v)}))));

}

// A name filter: words must all match; "a|b" matches either, "-x" excludes,
// "/re/" is a regular expression. Case does not matter.
function nameFilter(q){
  const terms=q.trim().toLowerCase().split(/\s+/).filter(Boolean).map(t=>{
    if(t.length>2&&t.startsWith('/')&&t.endsWith('/')){try{const re=new RegExp(t.slice(1,-1),'i');return m=>re.test(m)}catch(e){return ()=>true}}
    if(t.startsWith('-')&&t.length>1){const x=t.slice(1);return m=>!m.includes(x)}
    const alts=t.split('|').filter(Boolean);return m=>alts.some(a=>m.includes(a));
  });
  return name=>{const m=name.toLowerCase();return terms.every(f=>f(m))};
}
// thinkChips shows what the provider's list says of a model's thinking: a
// chip when it thinks, and the effort levels a request may ask for (the
// default in bold). For folded variants the levels are the variants.
function thinkChips(info,variants){
  const paid=info&&info.paid?el('span',{class:'badge warn',style:'margin-left:.45rem',title:'The provider serves it only on a paid plan'},'paid plan'):null;
  if(!info||!info.thinking)return paid;
  const tip=variants?t('One model per level upstream; intact picks the level from the effort the request asks for. Without one: {0}.',info.default||'none'):
    info.always?t('Always thinks; it cannot be switched off.'):t(info.efforts&&info.efforts.length?'Supports thinking; effort levels the request may ask for.':'Supports thinking.');
  return el('span',{style:'margin-left:.45rem;display:inline-flex;gap:.3rem;align-items:center;flex-wrap:wrap',title:tip},
    el('span',{class:'badge ok'},info.always?'thinking · always':'thinking'),paid);
}
// effortChips: the levels a request may ask for, coloured by level; the
// default is filled.
function effortChips(info,variants){
  const list=(info&&info.efforts)||[];
  if(!list.length)return el('span',{class:'faint small',text:'—'});
  return el('span',{style:'display:inline-flex;gap:.25rem;flex-wrap:nowrap'},...list.map(e=>{
    const v=e||'none',def=e===info.default;
    return el('span',{class:'eff eff-'+(/^[a-z-]+$/.test(v)?v:'none')+(def?' def':''),
      title:def?t(variants?'Default — used when the request names no effort':'Default when the request names none'):(variants?t('Variant {0}',v):'')},v);
  }));
}

function addAccount(p){
  // p is null for a new custom OpenAI-compatible provider.
  const setup=p?(setupOf(p)||(custom(p)?'custom':'key')):'custom';
  $('aTitle').textContent=p?t('Add {0} connection',pname(p)):t('Add a custom endpoint');
  $('aForm').reset();$('aErr').textContent='';
  $('aProv').value=p||'';$('aId').value='';
  const show=(id,on)=>$(id).hidden=!on;
  show('aIdRow',!p);show('aBaseRow',setup==='custom');show('aApiRow',!p);show('aAcctRow',setup==='account');
  show('aKeyRow',setup!=='none');show('aNoKey',setup==='none');
  $('aBase').value=p&&custom(p)?accountsOf(p).find(a=>a.baseUrl).baseUrl:'';
  openModal('aModal');
}
$('aId').oninput=()=>{$('aProv').value=$('aId').value.trim().toLowerCase()};
$('aForm').onsubmit=async e=>{
  e.preventDefault();
  if(guard($('aForm')))return;
  try{
    const fd=new FormData($('aForm'));
    if(!$('aKeyRow').hidden&&!$('aKey').value)throw new Error(t('The API key is required.'));
    if(!$('aAcctRow').hidden&&!$('aAcct').value.trim())throw new Error(t('The account ID is required.'));
    if(!$('aIdRow').hidden&&!/^[a-z0-9][a-z0-9-]{0,39}$/.test(fd.get('provider')))throw new Error(t('The provider id must be lowercase letters, digits or -.'));
    if(!$('aIdRow').hidden&&setupOf(fd.get('provider')))throw new Error(t('That id is a built-in provider; open it from the list instead.'));
    const r=await fetch('/accounts',{method:'POST',body:new URLSearchParams(fd)});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||('HTTP '+r.status))}
    const np=$('aProv').value;delete modelCache[np];closeModal('aModal');toast('Connection added');await load();
    if(!location.hash.endsWith('/'+np))location.hash='#/providers/'+encodeURIComponent(np);
  }catch(err){$('aErr').textContent=err.message}
  finally{release($('aForm'))}
};
async function deleteAccount(a){
  if(!confirm(t('Delete "{0}"?',a.label||a.id)))return;
  const r=await fetch('/accounts/'+a.id+'/delete',{method:'POST'});
  if(!r.ok){alert('Delete failed');return}
  delete modelCache[a.provider];toast('Deleted');await load();
}

  v.append(el('div',{class:'tabs',role:'tablist'},[['new','New',unacked.length],['all','All',0],['fields','Fields',0]].map(([k,n,c])=>

// The automatic drift review: its switch, state and settings.

    sw.onchange=async()=>{try{paint(await postJSON('/drift/review',{enabled:sw.checked}))}catch(e){alert(e.message);sw.checked=!sw.checked}};
    const run=el('button',{class:'ghost',type:'button',disabled:!st.enabled||!st.ready,title:'Judge the waiting changes now'},'Review now');
    run.onclick=async()=>{run.disabled=true;try{const r=await postJSON('/drift/review',{run:true});toast(t('Judged {0} change(s)',r.judged));await load()}catch(e){alert(e.message);run.disabled=false}};

        el('span',{class:'switch'},sw,el('span')),el('b',{style:'font-size:.85rem'},'Auto-resolve drift')),

async function ackDrift(ids){

async function blockDrift(c){

function driftFields(){

function untilText(iso){
  const at=Date.parse(iso);if(!at)return iso||'';
  let d=Math.round((at-Date.now())/60000);if(d<=0)return t('resetting');
  const days=Math.floor(d/1440);d-=days*1440;const h=Math.floor(d/60),m=d%60;
  return t('resets in {0}',(days?days+'d ':'')+(h?h+'h ':'')+(days?'':m+'m'));
}
function quotaWindow(w){
  const pct=w.usedPct;
  const color=w.unlimited?'var(--ok)':pct<0?'var(--faint)':pct>=90?'var(--err)':pct>=70?'var(--warn)':'var(--ok)';
  const right=w.unlimited?'unlimited':pct<0?(w.used?w.used+(w.limit?' / '+w.limit:''):'—')
    :t('{0}% used',Math.round(pct))+(w.used&&w.limit?' · '+w.used+' / '+w.limit:'');
  return el('div',{class:'qwin'},
    el('div',{class:'top'},el('b',{text:w.name}),el('span',{class:'muted',text:right})),
    el('div',{class:'qbar'},el('span',{style:'width:'+(w.unlimited?100:Math.max(0,Math.min(100,pct<0?0:pct)))+'%;background:'+color+(w.unlimited?';opacity:.35':'')})),
    w.resetAt?el('div',{class:'faint small',title:w.resetAt,text:untilText(w.resetAt)}):null);
}

        dt('tr',dt('td','removed'),dt('td','Một field gần như lúc nào cũng có đã vắng mặt 20 document liên tiếp.')),
        dt('tr',dt('td','returned'),dt('td','Một field đã bị removed nay xuất hiện lại.')))),
      dt('p','Mỗi endpoint học lặng lẽ trong ba document đầu tiên, sau đó mọi thay đổi đều được ghi lại kèm một mẫu của document chứa nó.'),
      dt('h2','Tự xử lý drift'),
      dt('p','Tự xử lý drift giải quyết mọi thay đổi mà không cần người. Model quyết định (model System One như typesafe/jev-latest) nhận những gì intact biết chắc về thay đổi (tham số hay schema của tool, trường vừa mất rồi xuất hiện lại trong ngày, client bắt đầu dùng stream hoặc tool trong giờ đó, client nào, số response lỗi sau đó) rồi chọn nguyên nhân; nguyên nhân lành tính đạt độ tự tin đã đặt (60%) và không có lỗi thì tự khép. Model xử lý (model chat bất kỳ như antigravity/gemini-3.8-flash) giải quyết toàn bộ phần còn lại: đánh dấu đã xem, hoặc blacklist một trường request mà provider từ chối, việc này chỉ được làm khi có response lỗi sau thay đổi và trường đó không phải trường request bắt buộc. Đặt cả hai trong ⚙; công tắc cần có model quyết định. Không có model xử lý thì các ca chưa chắc nằm chờ ở đây.'),
      dt('h2','Xử lý một thay đổi'),
      dt('p','Trên trang Drift, Chặn thêm field vào blacklist cho nhà cung cấp đó (đường dẫn ',dc('messages[].x'),' trở thành pattern ',dc('messages.*.x'),'), còn Đã xem đánh dấu thay đổi là đã xem xét.'),
      dt('h2','Capture tham chiếu'),
      dt('p','Có thể nạp sẵn cấu trúc từ một bản capture của tool thật trước khi intact phục vụ nó, để thay đổi đầu tiên được so với chính tool đó: ',dc('POST /api/drift/seed'),' với ',dc('{"direction","provider","endpoint","sse","documents":[…]}'),'. Document nạp sẵn được học mà không ghi thay đổi.'),
      dt('h2','API và MCP'),
      codeBlock('curl "'+o+'/api/drift/changes?unacked=1" -H "Authorization: Bearer $INTACT_KEY"\ncurl '+o+'/api/drift/ack -H "Authorization: Bearer $INTACT_KEY" -d \'{"ids":[12]}\'\ncurl "'+o+'/api/drift/fields?provider=codex&direction=response" -H "Authorization: Bearer $INTACT_KEY"'),
      dt('p','Tool MCP: ',dc('list_drift_changes'),', ',dc('ack_drift_changes'),', ',dc('list_drift_fields'),'. Agent có thể đọc các field request mới và thêm chúng bằng ',dc('add_filter'),'.'),
    ];
  },
};
function viewDocs(v,id){
  const d=DOCS.find(x=>x.id===id)||DOCS[0];
  header('Docs');
  v.append(el('div',{class:'docwrap'},
    el('div',{class:'tabs',role:'tablist'},DOCS.map(x=>el('a',{role:'tab',href:'#/docs/'+x.id,'aria-selected':String(x===d),class:x===d?'on':''},x.title))),
    el('article',{class:'doc'},LANG==='vi'&&DOCS_VI[d.id]?DOCS_VI[d.id]():d.body())));
}

// ---- Usage
function viewUsage(v){
  header('Usage');
  const stats=el('div',{class:'stats'});
  const today=new Date().toISOString().slice(0,10);
  const acctLabel=u=>{const a=accById(u.connectionId);return a?(a.label||short(a.id)):short(u.connectionId)+' '+t('(deleted)')};
  const provOf=u=>{const a=accById(u.connectionId);return a?pname(a.provider):'—'};
  const tbl=dataTable({
    rows:()=>S.usage,
    empty:'No usage recorded yet',
    // Today first, when there is usage today.
    initial:S.usage.some(u=>u.day===today)?{day:new Set([today])}:{},
    cols:[
      {id:'day',label:'Day',type:'chip',get:u=>u.day,order:v=>-Date.parse(v)||0,cls:'faint',tdStyle:'white-space:nowrap'},
      {id:'prov',label:'Provider',type:'chip',get:provOf},
      {id:'acct',label:'Account',type:'chip',get:acctLabel,td:u=>{const a=accById(u.connectionId);
        return a?el('span',{style:'display:inline-flex;align-items:center;gap:.45rem'},avatar(a.provider,true),a.label||short(a.id))
                :el('span',{class:'mono faint',text:acctLabel(u)})}},
      {id:'model',label:'Model',type:'text',get:u=>u.model||'',cls:'mono'},
      {id:'in',label:'Input',type:'num',cls:'num',get:u=>u.inputTokens,td:u=>fmt(u.inputTokens)},
      {id:'out',label:'Output',type:'num',cls:'num',get:u=>u.outputTokens,td:u=>fmt(u.outputTokens)},
      {id:'req',label:'Requests',type:'num',cls:'num',get:u=>u.requests,td:u=>fmt(u.requests)},
    ],
    // The totals are those of the rows the filters show.
    onRender:rows=>{const sum=k=>rows.reduce((s,u)=>s+u[k],0);
      stats.replaceChildren(...[['Requests',sum('requests')],['Input tokens',sum('inputTokens')],['Output tokens',sum('outputTokens')]]
        .map(([k,n])=>el('div',{class:'stat'},el('div',{class:'k',text:k}),el('div',{class:'v',text:fmt(n)}))))},
  });
  if(!S.usage.length){v.append(el('div',{class:'card'},el('div',{class:'empty'},el('b',{},'No usage recorded yet'),'Requests through /v1 show up here.')));return}
  v.append(stats,el('div',{style:'display:flex;justify-content:flex-end;margin-bottom:-1rem'},tbl.clearBtn),el('div',{class:'card scroll'},tbl.table));
  tbl.render();
}

translateStatic(document.body);paintPrefs();
load();
