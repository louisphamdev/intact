<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intact</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px system-ui, -apple-system, Segoe UI, sans-serif;
         margin: 0; padding: 2rem 1.25rem; background: #0f1115; color: #e6e9ef; }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.5rem; color: #8b94a5; font-size: .82rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid #262b36; }
  th { color: #8b94a5; font-weight: 500; font-size: .75rem;
       text-transform: uppercase; letter-spacing: .04em; }
  code { font-family: ui-monospace, Consolas, monospace; color: #7dd3fc; font-size: .82rem; }
  .yes { color: #4ade80; }
  .no  { color: #8b94a5; }
</style>
</head>
<body>
<main>
  <h1>Accounts</h1>
  <p class="sub">Credentials stay on this host. Responses from a provider are passed through unchanged.</p>
  <table>
    <thead><tr><th>Provider</th><th>Label</th><th>Connection id</th><th>Active</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody>
  </table>
</main>
<script>
fetch('/accounts')
  .then(r => r.json())
  .then(d => {
    const rows = (d.accounts || []).map(a =>
      '<tr><td>' + a.provider + '</td><td>' + a.label +
      '</td><td><code>' + a.id + '</code></td><td class="' + (a.isActive ? 'yes' : 'no') + '">' +
      (a.isActive ? 'yes' : 'no') + '</td></tr>'
    ).join('');
    document.getElementById('rows').innerHTML =
      rows || '<tr><td colspan="4">No accounts yet.</td></tr>';
  })
  .catch(() => {
    document.getElementById('rows').innerHTML =
      '<tr><td colspan="4">Could not reach /accounts.</td></tr>';
  });
</script>
</body>
</html>
